<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forge wish panel review</title>
  <style>
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { background: #25291f; font-family: Georgia, serif; }
    .stage { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 52% 54%, #777151 0%, #515844 36%, #29332b 100%); }
    .stage::before { content: ''; position: absolute; inset: 58% 0 0; background: linear-gradient(#545441, #30392d); }
    .stage::after { content: 'STAGED BACKDROP · PANEL REVIEW'; position: absolute; bottom: 12px; left: 14px; color: #ede1bc; opacity: .65; font: 10px/1.2 sans-serif; letter-spacing: .12em; pointer-events: none; }
    #panel { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true"></div>
  <div id="panel"></div>
  <script type="module" src="./index.ts"></script>
</body>
</html>
