<svg xmlns="http://www.w3.org/2000/svg" width="420" height="280" viewBox="0 0 420 280">
  <!-- Walnut with long horizontal grain: two noise fields, stretched along the plank. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0028 0.16" numOctaves="4" seed="17" stitchTiles="stitch" result="n" />
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.09  0 0 0 0 0.055  0 0 0 0 0.035  -2.4 0 0 0 1.35" />
  </filter>
  <filter id="figure" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="turbulence" baseFrequency="0.0045 0.045" numOctaves="2" seed="5" stitchTiles="stitch" result="n" />
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.43  0 0 0 0 0.27  2.2 0 0 0 -0.62" />
  </filter>
  <rect width="420" height="280" fill="#3a281c" />
  <rect width="420" height="280" filter="url(#figure)" opacity=".55" />
  <rect width="420" height="280" filter="url(#grain)" opacity=".8" />
</svg>
