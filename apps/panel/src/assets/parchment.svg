<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Laid paper: soft mottling, a few dark fibres, and faint chain lines. -->
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="3" stitchTiles="stitch" result="n" />
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.4  0 0 0 0 0.22  1.3 0 0 0 -0.5" />
  </filter>
  <filter id="fibre" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.25" numOctaves="1" seed="8" stitchTiles="stitch" result="n" />
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.14  6 0 0 0 -4.1" />
  </filter>
  <rect width="300" height="300" fill="#e9d8b2" />
  <rect width="300" height="300" filter="url(#mottle)" opacity=".42" />
  <rect width="300" height="300" filter="url(#fibre)" opacity=".5" />
  <path d="M0 37.5h300M0 112.5h300M0 187.5h300M0 262.5h300" stroke="#a88a5a" stroke-width=".5" opacity=".12" />
</svg>
