<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Policy 2.9: the Extension Helper must be the FIRST script, loaded from Twitch's CDN (never bundled/self-hosted). -->
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <title>Poll – live controls</title>
  </head>
  <body class="page-live-config">
    <main>
      <h1>Live poll controls</h1>
      <ol id="options" class="options"></ol>
      <button id="reset">Reset votes</button>
      <button id="announce">Ping viewers</button>
      <p id="status" class="status" role="status"></p>
    </main>
    <!-- No inline scripts (CSP). Vite turns this into ./assets/live_config-[hash].js -->
    <script type="module" src="./src/live_config.ts"></script>
  </body>
</html>
